[package]
name = "supervise_runner"
version = "0.1.0"
description = "监督闭环进程桥：spawn pwsh supervise.ps1 + 解析 .supervise 产物"
edition = "2021"

[dependencies]
path_util = { path = "../path_util" }
terminal_host = { path = "../terminal_host" }
agent_registry = { path = "../agent_registry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
