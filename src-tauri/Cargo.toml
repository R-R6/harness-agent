[package]
name = "harness_agent"
version = "0.1.0"
description = "Harness Agent - 驾驭 Claude 干活 + Codex 审查的桌面端监督闭环应用"
authors = ["wuzhaoguo"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "harness_agent_lib"
# 桌面端只需 rlib（main.exe 直接链接）。cdylib/staticlib 是移动端所需，
# 且 cdylib 在 Windows GNU 目标下会导出 windows crate 全部符号，
# 超过 PE 导出表 65535 上限（ld/lld: too many exported symbols）。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
session_proxy = { path = "crates/session_proxy" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
members = [".", "crates/session_proxy"]
resolver = "2"

